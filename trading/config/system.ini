# Algo trading skeleton: three SHM buses + per-component options.
# Sizes accept k/m/g. Ledger = queue_size / size_hint slots (40 B each).

[queue client_bus]            ; clients <-> gateway
key        = ${TMPDIR:-/tmp}/trading_client_bus.key
queue_size = 64m
size_hint  = 128
consumers  = 32

[queue order_bus]             ; gateway, OMS, algo engine, EMS, exchange, persister
key        = ${TMPDIR:-/tmp}/trading_order_bus.key
queue_size = 256m
size_hint  = 128
consumers  = 16

[queue md_bus]                ; market data handler -> OMS, algo engine
key        = ${TMPDIR:-/tmp}/trading_md_bus.key
queue_size = 256m
size_hint  = 128
consumers  = 16

[component md_handler]
sim         = true
symbols     = BTCUSDT,ETHUSDT,SOLUSDT
interval_us = 1000

[component exchange_sim]
fill_mode = full              ; full | ack | partial

[component persister]
out         = ${TMPDIR:-/tmp}/trading_journal.log
log_md      = false
flush_every = 256

[component client_sim]
client-id    = 7
orders       = 1000
algo-ratio   = 0.5
cancel-ratio = 0
timeout-ms   = 10000

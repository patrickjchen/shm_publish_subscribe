# Two producers on topics 1 and 2 -> one relay (mask 0b0110 = topics 1,2) -> sink on topic 5.
# Run:  shm_task --config examples/configs/fanin_relay.ini
# Key files default to $TMPDIR (or /tmp); override with TMPDIR=... or edit `key`.

[pipeline]
ready_timeout_s = 10

# No back-pressure: a consumer that falls more than `ledger` (= queue_size / size_hint)
# messages behind reads overwritten slots. Sizes accept k/m/g. The ledger costs 40 B per
# slot, so a 1g queue with size_hint 64 is ~1.6 GiB of RAM; size_hint 512 keeps it ~1.1 GiB
# (2M slots). `shm_task --list` prints est_segment for each queue.
[queue md]
key        = ${TMPDIR:-/tmp}/shmctx_md.key
queue_size = ${SHMCTX_QUEUE_SIZE:-1g}
consumers  = 8
size_hint  = 512
create     = true

[queue strat]                 ; secondary queue: keep small so the pipeline fits in RAM
key        = ${TMPDIR:-/tmp}/shmctx_strat.key
queue_size = 256m
create     = true

[task feed_btc]
type   = producer
queue  = md
id     = 1
topic  = 1
count  = 500000
size   = 96

[task feed_eth]
type   = producer
queue  = md
id     = 2
topic  = 2
count  = 500000
size   = 96

[task noise]              ; published on topic 3: nobody downstream subscribes to it
type   = producer
queue  = md
id     = 3
topic  = 3
count  = 100000

[task relay]
type      = relay
in        = md
subscribe = 0b0110        ; topics 1 and 2 (bit i = topic i)
out       = strat
out_topic = 5
id        = 10
ends      = 2             ; two upstream producers -> two End markers

[task sink]
type      = consumer
queue     = strat
subscribe = 5
ends      = 2
timeout_s = 30

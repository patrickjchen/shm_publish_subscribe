# Three-hop chain on a single queue: producer(topic 1) -> relay A(1 -> 2) -> relay B(2 -> 3) -> sink(3).
# Each relay reads and writes the same queue, so its mask must exclude its own out_topic.

[queue bus]
key        = ${TMPDIR:-/tmp}/shmctx_bus.key
queue_size = ${SHMCTX_QUEUE_SIZE:-1g}   ; 3 streams x 500k messages share one ledger (2M slots)
size_hint  = 512
create     = true

[task src]
type  = producer
queue = bus
id    = 1
topic = 1
count = 500000

[task hop_a]
type      = relay
in        = bus
out       = bus
subscribe = 1
out_topic = 2
id        = 11

[task hop_b]
type      = relay
in        = bus
out       = bus
subscribe = 0x4          ; topic 2
out_topic = 3
id        = 12

[task sink]
type      = consumer
queue     = bus
subscribe = 3
ends      = 1

# Strategy-id routing: one feed publishes with strategy_id 7, another with 9.
# Consumers subscribe to the same topic but filter by strategy id; broadcast
# (strategy 0) End markers reach both.

[queue orders]
key        = ${TMPDIR:-/tmp}/shmctx_orders.key
queue_size = ${SHMCTX_QUEUE_SIZE:-1g}
size_hint  = 512
create     = true

[task strat7]
type        = producer
queue       = orders
id          = 7
topic       = 4
strategy_id = 7
count       = 300000

[task strat9]
type        = producer
queue       = orders
id          = 9
topic       = 4
strategy_id = 9
count       = 300000

[task risk_all]           ; strategy_ids = all  -> sees both streams
type         = consumer
queue        = orders
subscribe    = 4
strategy_ids = all
ends         = 2

[task only7]              ; strategy_ids = 7 -> sees strat7 data, but End markers from both
type         = consumer
queue        = orders
subscribe    = 4
strategy_ids = 7
ends         = 2
expect       = 300000
